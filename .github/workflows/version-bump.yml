name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main, master]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect version bump type
        id: bump_type
        run: |
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | jq -r '.[]')

          if echo "$LABELS" | grep -q "^major$"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "^minor$"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "^patch$"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi

      - name: Get current version
        id: get_version
        if: steps.bump_type.outputs.type != 'none'
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' mutagene/version.py)
          echo "current=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        if: steps.bump_type.outputs.type != 'none'
        run: |
          CURRENT="${{ steps.get_version.outputs.current }}"
          TYPE="${{ steps.bump_type.outputs.type }}"

          IFS='.' read -r major minor patch <<< "$CURRENT"

          case $TYPE in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          NEW_VERSION="$major.$minor.$patch"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version files
        if: steps.bump_type.outputs.type != 'none'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Update pyproject.toml
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" pyproject.toml

          # Update mutagene/version.py
          # Double quotes: black normalises to them, and a single-quoted
          # version would make this bot's own commit fail the format check.
          sed -i "s/^__version__ = .*/__version__ = \"$NEW_VERSION\"/" mutagene/version.py

      - name: Require a changelog entry
        if: steps.bump_type.outputs.type != 'none'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          if ! grep -q "^## \[$NEW_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$NEW_VERSION]' section."
            echo "A release without notes is not worth publishing. Add the section"
            echo "to CHANGELOG.md in the pull request that carries the version label."
            exit 1
          fi

      - name: Commit and tag
        if: steps.bump_type.outputs.type != 'none'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml mutagene/version.py
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"

          git push origin ${{ github.event.pull_request.base.ref }}
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        if: steps.bump_type.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # The notes are the changelog section for this version: what changed,
          # rather than the title of whichever pull request happened to trip the
          # version bump.
          # Plain prefix comparison rather than a regex: a bracket in an awk
          # -v value turns into a character class, which matched nothing and
          # would have published every release with empty notes.
          awk -v marker="## [$NEW_VERSION]" '
            index($0, marker) == 1 {found = 1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::Extracted empty release notes for $NEW_VERSION."
            exit 1
          fi

          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --notes-file release_notes.md
