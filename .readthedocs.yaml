# Read the Docs has required this file since 2023; without it the build never
# runs, which is why the published site still described 1.0.0 and served 404s
# for pages added since.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Surface problems rather than publishing a page with a broken reference.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

# HTML only. PDF and epub go through latex, whose warnings would fail a build
# under fail_on_warning and leave the site unpublished again -- the outcome this
# file exists to prevent.
formats: []
