<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | MutaGene</title>
  <link rel="icon" href="{{ url_for('static', filename='ico/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/local.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="masthead">
    <nav aria-label="Main navigation">
      <a class="brand" href="/">MutaGene</a>
      <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>New analysis</a>
      <a href="/history" {% if request.path == '/history' %}aria-current="page"{% endif %}>History</a>
      <a href="https://mutagene.readthedocs.io">Help</a>
    </nav>
  </header>
  <main id="content">
    <noscript><p class="alert alert-warning">Enable JavaScript to submit files and use interactive results.</p></noscript>
    {% for message in get_flashed_messages() %}<p class="alert alert-warning">{{ message }}</p>{% endfor %}
    <p id="requestError" role="alert" class="alert alert-danger" hidden></p>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="https://github.com/neksa/mutagene">Source code</a>
    <a href="https://mutagene.readthedocs.io">Documentation</a>
    <a href="https://doi.org/10.1093/nar/gkx367">Citation</a>
  </footer>
  <script src="{{ url_for('static', filename='js/local.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
